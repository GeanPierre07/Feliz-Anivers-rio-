<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seu último presente 🎁</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            color: white;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            overflow-x: hidden;
        }

        /* FUNDO */

        .background {
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 50, 90, .12),
                    transparent 45%
                ),
                #000;

            z-index: 0;
        }

        /* ESTRELAS */

        .star {
            position: fixed;

            width: 2px;
            height: 2px;

            background: white;

            border-radius: 50%;

            animation: piscar 2s infinite alternate;

            z-index: 1;
        }

        @keyframes piscar {

            from {
                opacity: .2;
            }

            to {
                opacity: 1;
            }
        }

        /* CONTEÚDO */

        .container {
            position: relative;

            z-index: 5;

            width: 90%;

            max-width: 800px;

            padding: 50px 20px;

            animation: aparecer 1.5s ease;
        }

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pequeno {

            color: #888;

            font-size: 12px;

            letter-spacing: 5px;

            text-transform: uppercase;

            margin-bottom: 20px;
        }

        h1 {

            font-size: clamp(35px, 8vw, 65px);

            margin-bottom: 15px;

            background:
                linear-gradient(
                    90deg,
                    #fff,
                    #ff4d6d,
                    #fff
                );

            background-size: 200%;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: brilho 4s linear infinite;
        }

        @keyframes brilho {

            from {
                background-position: 0%;
            }

            to {
                background-position: 200%;
            }
        }

        .descricao {

            color: #aaa;

            font-size: 17px;

            line-height: 1.7;

            margin-bottom: 40px;
        }


        /* PRESENTES */

        .presentes {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 25px;

            flex-wrap: wrap;
        }

        .presente {

            width: 170px;

            height: 190px;

            border: 1px solid rgba(255,255,255,.15);

            border-radius: 20px;

            background:
                rgba(255,255,255,.04);

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            cursor: pointer;

            transition: .4s;

            backdrop-filter: blur(10px);

            user-select: none;
        }

        .presente:hover {

            transform:
                translateY(-10px)
                scale(1.05);

            border-color: #ff4d6d;

            box-shadow:
                0 0 35px
                rgba(255,77,109,.3);
        }

        .emoji-presente {

            font-size: 70px;

            margin-bottom: 15px;

            filter:
                drop-shadow(
                    0 0 10px
                    rgba(255,255,255,.15)
                );

            transition: .4s;
        }

        .presente:hover .emoji-presente {

            transform: scale(1.15);
        }

        .numero {

            color: #888;

            font-size: 13px;

            letter-spacing: 2px;
        }


        /* PRESENTE ESCOLHIDO */

        .presente.escolhido {

            border-color: #ff4d6d;

            background:
                rgba(255,77,109,.08);

            transform: scale(1.05);

            box-shadow:
                0 0 40px
                rgba(255,77,109,.25);
        }


        /* PRESENTES BLOQUEADOS */

        .presente.bloqueado {

            opacity: .15;

            filter: grayscale(1);

            cursor: not-allowed;

            pointer-events: none;

            transform: scale(.95);
        }


        /* RESULTADO */

        .resultado {

            display: none;

            margin-top: 40px;

            padding: 30px;

            border-radius: 20px;

            background:
                rgba(255,255,255,.05);

            border:
                1px solid
                rgba(255,255,255,.12);

            animation:
                revelar .8s ease forwards;
        }

        @keyframes revelar {

            from {

                opacity: 0;

                transform:
                    scale(.8)
                    translateY(20px);
            }

            to {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);
            }
        }

        .resultado .emoji {

            font-size: 80px;

            margin-bottom: 15px;

            animation:
                aparecerEmoji 1s ease;
        }

        @keyframes aparecerEmoji {

            0% {

                transform: scale(0)
                    rotate(-20deg);

                opacity: 0;
            }

            70% {

                transform: scale(1.2)
                    rotate(10deg);
            }

            100% {

                transform: scale(1)
                    rotate(0);

                opacity: 1;
            }
        }

        .resultado h2 {

            color: #ff4d6d;

            font-size: 30px;

            margin-bottom: 15px;
        }

        .resultado p {

            color: #ccc;

            font-size: 16px;

            line-height: 1.8;
        }

        .aviso {

            margin-top: 25px;

            color: #777;

            font-size: 13px;

            font-style: italic;
        }


        /* CORAÇÕES */

        .heart {

            position: fixed;

            bottom: -30px;

            color: #ff4d6d;

            font-size: 20px;

            pointer-events: none;

            z-index: 3;

            animation:
                subir 6s linear forwards;
        }

        @keyframes subir {

            0% {

                transform:
                    translateY(0)
                    rotate(0);

                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            100% {

                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }


        /* RESPONSIVO */

        @media (max-width: 600px) {

            .presentes {

                gap: 15px;
            }

            .presente {

                width: 140px;

                height: 170px;
            }

            .emoji-presente {

                font-size: 60px;
            }
        }

    </style>
</head>

<body>

    <div class="background"></div>

    <div class="container">

        <div class="pequeno">
            chegou a hora...
        </div>

        <h1>
            Escolha seu presente 🎁
        </h1>

        <p class="descricao">
            Existem três presentes esperando por você.<br>
            Mas cuidado... depois que escolher, não tem como voltar. 👀
        </p>


        <!-- PRESENTES -->

        <div class="presentes" id="presentes">

            <!-- PRESENTE 1 -->

            <div
                class="presente"
                onclick="escolherPresente(1)"
                id="presente1"
            >

                <div class="emoji-presente">
                    🎁
                </div>

                <div class="numero">
                    PRESENTE 01
                </div>

            </div>


            <!-- PRESENTE 2 -->

            <div
                class="presente"
                onclick="escolherPresente(2)"
                id="presente2"
            >

                <div class="emoji-presente">
                    🎁
                </div>

                <div class="numero">
                    PRESENTE 02
                </div>

            </div>


            <!-- PRESENTE 3 -->

            <div
                class="presente"
                onclick="escolherPresente(3)"
                id="presente3"
            >

                <div class="emoji-presente">
                    🎁
                </div>

                <div class="numero">
                    PRESENTE 03
                </div>

            </div>

        </div>


        <!-- RESULTADO -->

        <div
            class="resultado"
            id="resultado"
        >

            <div
                class="emoji"
                id="emojiResultado"
            ></div>

            <h2 id="nomeResultado"></h2>

            <p id="mensagemResultado"></p>

            <div class="aviso">
                Você já escolheu... agora não vale tentar voltar. kkkkk 😈
            </div>

        </div>

    </div>


    <script>

        /* ==============================
           ESTRELAS
        ============================== */

        for (let i = 0; i < 120; i++) {

            const estrela =
                document.createElement("div");

            estrela.classList.add("star");

            estrela.style.left =
                Math.random() * 100 + "vw";

            estrela.style.top =
                Math.random() * 100 + "vh";

            estrela.style.animationDelay =
                Math.random() * 3 + "s";

            document.body.appendChild(estrela);
        }


        /* ==============================
           PRESENTES
        ============================== */

        const presentes = {

            1: {
                nome: "Fênix",
                emoji: "🔥🦅",
                mensagem:
                    "Você encontrou a Fênix. 🔥🦅 Uma escolha poderosa... renascimento, força e algo que nunca deixa de voltar ainda mais forte."
            },

            2: {
                nome: "Mini Lion",
                emoji: "🦁",
                mensagem:
                    "Você encontrou o Mini Lion. 🦁 Pequeno no tamanho, mas gigante na presença. Uma escolha fofinha, mas perigosa kkkkk."
            },

            3: {
                nome: "Zeus",
                emoji: "⚡🧔",
                mensagem:
                    "Você encontrou Zeus. ⚡🧔 Você literalmente escolheu o deus dos deuses. Agora aguenta as consequências dessa escolha. kkkkk"
            }

        };


        let jaEscolheu = false;


        /* ==============================
           ESCOLHER PRESENTE
        ============================== */

        function escolherPresente(numero) {

            /*
                Se já escolheu,
                não deixa escolher novamente.
            */

            if (jaEscolheu) {

                return;
            }


            jaEscolheu = true;


            const presenteEscolhido =
                document.getElementById(
                    "presente" + numero
                );


            /*
                Marca o escolhido
            */

            presenteEscolhido.classList.add(
                "escolhido"
            );


            /*
                Bloqueia os outros dois
            */

            for (let i = 1; i <= 3; i++) {

                if (i !== numero) {

                    document
                        .getElementById(
                            "presente" + i
                        )
                        .classList.add(
                            "bloqueado"
                        );
                }
            }


            /*
                Dados do presente
            */

            const dados =
                presentes[numero];


            /*
                Coloca resultado
            */

            document.getElementById(
                "emojiResultado"
            ).innerHTML =
                dados.emoji;


            document.getElementById(
                "nomeResultado"
            ).innerHTML =
                dados.nome;


            document.getElementById(
                "mensagemResultado"
            ).innerHTML =
                dados.mensagem;


            /*
                Mostra resultado
            */

            document.getElementById(
                "resultado"
            ).style.display =
                "block";


            /*
                Rola até o resultado
            */

            setTimeout(() => {

                document
                    .getElementById("resultado")
                    .scrollIntoView({
                        behavior: "smooth",
                        block: "center"
                    });

            }, 300);


            /*
                Solta corações
            */

            criarCoracoes();

        }


        /* ==============================
           CORAÇÕES
        ============================== */

        function criarCoracoes() {

            for (
                let i = 0;
                i < 25;
                i++
            ) {

                setTimeout(() => {

                    const heart =
                        document.createElement(
                            "div"
                        );

                    heart.classList.add(
                        "heart"
                    );

                    heart.innerHTML =
                        Math.random() > .5
                        ? "❤️"
                        : "♡";


                    heart.style.left =
                        Math.random() * 100 +
                        "vw";


                    heart.style.fontSize =
                        (15 +
                        Math.random() * 25) +
                        "px";


                    heart.style.animationDuration =
                        (3 +
                        Math.random() * 4) +
                        "s";


                    document.body.appendChild(
                        heart
                    );


                    setTimeout(() => {

                        heart.remove();

                    }, 7000);

                }, i * 120);

            }

        }

    </script>

</body>
</html>
