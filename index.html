```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma surpresa para você ✨</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", sans-serif;
    background: #000;
    color: white;
}

body {
    position: relative;
}

/* FUNDO */
.background {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 50% 50%, #151515 0%, #050505 45%, #000 100%);
    z-index: -3;
}

/* ESTRELAS */
.stars,
.stars2,
.stars3 {
    position: fixed;
    inset: 0;
    background-repeat: repeat;
    pointer-events: none;
}

.stars {
    z-index: -2;
    background-image:
        radial-gradient(2px 2px at 20px 30px, white, transparent),
        radial-gradient(1px 1px at 90px 70px, white, transparent),
        radial-gradient(2px 2px at 150px 120px, white, transparent),
        radial-gradient(1px 1px at 220px 40px, white, transparent),
        radial-gradient(2px 2px at 300px 180px, white, transparent),
        radial-gradient(1px 1px at 380px 90px, white, transparent);
    background-size: 420px 220px;
    animation: moveStars 35s linear infinite;
    opacity: .65;
}

.stars2 {
    z-index: -1;
    background-image:
        radial-gradient(1px 1px at 50px 100px, white, transparent),
        radial-gradient(2px 2px at 180px 50px, white, transparent),
        radial-gradient(1px 1px at 270px 150px, white, transparent),
        radial-gradient(2px 2px at 350px 30px, white, transparent);
    background-size: 500px 250px;
    animation: moveStars 60s linear infinite reverse;
    opacity: .35;
}

.stars3 {
    z-index: -1;
    background-image:
        radial-gradient(1px 1px at 100px 50px, white, transparent),
        radial-gradient(1px 1px at 250px 200px, white, transparent),
        radial-gradient(1px 1px at 400px 100px, white, transparent);
    background-size: 600px 300px;
    animation: moveStars 90s linear infinite;
    opacity: .25;
}

@keyframes moveStars {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(220px);
    }
}

/* CONTEÚDO */
.container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 25px;
}

.content {
    max-width: 700px;
}

/* PEQUENO TEXTO */
.subtitle {
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #aaa;
    margin-bottom: 30px;
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: .5s;
}

/* FRASE */
.title {
    font-size: clamp(35px, 7vw, 75px);
    font-weight: 300;
    line-height: 1.15;
    letter-spacing: -2px;
    margin-bottom: 25px;
}

.title span {
    display: block;
    opacity: 0;
    transform: translateY(25px);
    animation: textAppear 1.5s ease forwards;
}

.title span:nth-child(1) {
    animation-delay: 1.5s;
}

.title span:nth-child(2) {
    animation-delay: 2.5s;
}

.title span:nth-child(3) {
    animation-delay: 3.5s;
}

.highlight {
    font-weight: 600;
    background: linear-gradient(90deg, #fff, #aaa, #fff);
    background-size: 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation:
        textAppear 1.5s ease forwards,
        shine 4s linear infinite;
    animation-delay: 3.5s, 5s;
}

/* DESCRIÇÃO */
.description {
    color: #888;
    font-size: 16px;
    line-height: 1.7;
    max-width: 500px;
    margin: 0 auto 40px;
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 4.8s;
}

/* BOTÃO */
.button-wrapper {
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 5.8s;
}

.button {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 16px 35px;
    min-width: 220px;
    border: 1px solid #444;
    border-radius: 50px;
    color: white;
    background: rgba(255,255,255,.03);
    text-decoration: none;
    font-size: 15px;
    letter-spacing: 2px;
    cursor: pointer;
    overflow: hidden;
    transition: .4s ease;
    backdrop-filter: blur(8px);
}

.button::before {
    content: "";
    position: absolute;
    left: -100%;
    top: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.15),
        transparent
    );
    transition: .7s;
}

.button:hover::before {
    left: 100%;
}

.button:hover {
    transform: translateY(-4px);
    border-color: #aaa;
    box-shadow:
        0 0 20px rgba(255,255,255,.12),
        0 0 60px rgba(255,255,255,.05);
    background: rgba(255,255,255,.07);
}

/* BRILHO CENTRAL */
.glow {
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(255,255,255,.035),
        transparent 70%
    );
    pointer-events: none;
    animation: pulse 5s ease-in-out infinite;
    z-index: -1;
}

@keyframes pulse {
    0%, 100% {
        transform: scale(1);
        opacity: .5;
    }

    50% {
        transform: scale(1.2);
        opacity: .9;
    }
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes textAppear {
    from {
        opacity: 0;
        transform: translateY(25px);
        filter: blur(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
    }
}

@keyframes shine {
    0% {
        background-position: 200%;
    }

    100% {
        background-position: -200%;
    }
}

/* RESPONSIVO */
@media (max-width: 600px) {

    .title {
        font-size: 42px;
    }

    .description {
        font-size: 14px;
    }

    .button {
        min-width: 200px;
    }

    .glow {
        width: 300px;
        height: 300px;
    }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="stars"></div>
<div class="stars2"></div>
<div class="stars3"></div>

<div class="glow"></div>

<main class="container">

    <div class="content">

        <div class="subtitle">
            Uma pequena surpresa
        </div>

        <h1 class="title">
            <span>Hoje não é</span>
            <span>um dia qualquer...</span>
            <span class="highlight">é o seu dia.</span>
        </h1>

        <p class="description">
            Eu poderia simplesmente te desejar feliz aniversário...
            mas achei que você merecia algo um pouco diferente.
        </p>

        <div class="button-wrapper">

            <a href="surpresa.html" class="button">
                Clique para descobrir ✦
            </a>

        </div>

    </div>

</main>

</body>
</html>
```
