<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uma surpresa para você</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .stars {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(2px 2px at 10% 20%, white, transparent),
                radial-gradient(1px 1px at 30% 80%, white, transparent),
                radial-gradient(2px 2px at 70% 30%, white, transparent),
                radial-gradient(1px 1px at 90% 70%, white, transparent),
                radial-gradient(1px 1px at 50% 50%, white, transparent),
                radial-gradient(2px 2px at 80% 10%, white, transparent),
                radial-gradient(1px 1px at 20% 60%, white, transparent);

            background-size: 300px 300px;
            animation: estrelas 10s linear infinite;
            opacity: .6;
        }

        @keyframes estrelas {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-300px);
            }
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 90%;
            max-width: 700px;
        }

        .subtitulo {
            color: #888;
            font-size: 13px;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 25px;
            animation: aparecer 2s ease;
        }

        h1 {
            font-size: clamp(42px, 9vw, 80px);
            margin-bottom: 25px;

            background: linear-gradient(
                90deg,
                #fff,
                #ff4d6d,
                #fff
            );

            background-size: 200%;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation:
                aparecer 2s ease,
                brilho 4s linear infinite;
        }

        @keyframes brilho {
            from {
                background-position: 0%;
            }

            to {
                background-position: 200%;
            }
        }

        .mensagem {
            color: #ccc;
            font-size: 18px;
            line-height: 1.8;
            min-height: 80px;
        }

        .cursor {
            color: #ff4d6d;
            animation: piscar .7s infinite;
        }

        @keyframes piscar {
            50% {
                opacity: 0;
            }
        }

        .coracao {
            font-size: 45px;
            margin: 30px 0;
            animation: pulsar 1.5s infinite;
        }

        @keyframes pulsar {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        .botao {
            display: inline-block;
            padding: 16px 35px;

            border: 1px solid #ff4d6d;
            border-radius: 50px;

            background: transparent;
            color: white;

            font-size: 16px;
            text-decoration: none;

            cursor: pointer;

            transition: .3s;

            box-shadow: 0 0 0 rgba(255, 77, 109, 0);
        }

        .botao:hover {
            background: #ff4d6d;

            box-shadow:
                0 0 30px rgba(255, 77, 109, .6);

            transform: scale(1.05);
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="stars"></div>

    <main class="container">

        <div class="subtitulo">
            uma pequena surpresa...
        </div>

        <h1>
            Feliz Aniversário ❤️
        </h1>

        <div class="mensagem">
            <span id="texto"></span>
            <span class="cursor">|</span>
        </div>

        <div class="coracao">
            ❤️
        </div>

        <!-- BOTÃO QUE ABRE A SURPRESA -->
        <a href="surpresa.html" class="botao">
            Clique para descobrir
        </a>

    </main>

    <script>

        const texto =
            "Eu poderia simplesmente te mandar uma mensagem... mas achei que você merecia algo diferente.";

        let i = 0;

        function escrever() {

            if (i < texto.length) {

                document.getElementById("texto").innerHTML +=
                    texto.charAt(i);

                i++;

                setTimeout(escrever, 45);
            }
        }

        escrever();

    </script>

</body>
</html>
