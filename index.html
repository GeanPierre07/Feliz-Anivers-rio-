```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uma surpresa para você ✨</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* FUNDO */

        .background {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(120, 0, 255, 0.15), transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(0, 100, 255, 0.12), transparent 30%),
                #000;
            z-index: -2;
        }

        /* ESTRELAS */

        .stars {
            position: fixed;
            inset: 0;
            z-index: -1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {

            0%, 100% {
                opacity: 0.2;
            }

            50% {
                opacity: 1;
            }

        }

        /* CONTEÚDO */

        .container {
            height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 20px;
        }

        h1 {
            font-size: clamp(2.5rem, 7vw, 5rem);

            margin-bottom: 25px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #a855f7,
                #ffffff
            );

            background-size: 200%;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: shine 4s linear infinite;
        }

        @keyframes shine {

            0% {
                background-position: 0%;
            }

            100% {
                background-position: 200%;
            }

        }

        #text {
            font-size: 1.1rem;
            color: #aaa;

            max-width: 650px;

            min-height: 50px;

            line-height: 1.7;
        }

        /* BOTÃO */

        button {
            margin-top: 35px;

            padding: 15px 30px;

            border-radius: 50px;

            border: 1px solid #9333ea;

            background: transparent;

            color: white;

            font-size: 1rem;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 0 20px rgba(147, 51, 234, 0.2);
        }

        button:hover {

            background: #9333ea;

            transform: scale(1.07);

            box-shadow:
                0 0 35px rgba(147, 51, 234, 0.6);

        }

        /* ANIMAÇÃO DE ENTRADA */

        .container > * {
            opacity: 0;

            transform: translateY(20px);

            animation: aparecer 1.2s forwards;
        }

        h1 {
            animation-delay: 0.3s;
        }

        #text {
            animation-delay: 0.8s;
        }

        button {
            animation-delay: 1.3s;
        }

        @keyframes aparecer {

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

    </style>
</head>

<body>

    <div class="background"></div>

    <div class="stars" id="stars"></div>

    <div class="container">

        <h1>
            Tenho uma coisa pra te mostrar...
        </h1>

        <p id="text"></p>

        <button onclick="descobrir()">
            Clique para descobrir ✨
        </button>

    </div>


    <script>

        /* CRIAR ESTRELAS */

        const stars = document.getElementById("stars");

        for (let i = 0; i < 150; i++) {

            const star = document.createElement("div");

            star.classList.add("star");

            star.style.left =
                Math.random() * 100 + "%";

            star.style.top =
                Math.random() * 100 + "%";

            star.style.animationDelay =
                Math.random() * 3 + "s";

            stars.appendChild(star);

        }


        /* TEXTO DIGITANDO */

        const frase =
            "Algumas coisas merecem ser descobertas aos poucos...";

        let i = 0;

        function escrever() {

            if (i < frase.length) {

                document.getElementById("text").textContent +=
                    frase.charAt(i);

                i++;

                setTimeout(escrever, 50);

            }

        }

        escrever();


        /* BOTÃO */

        function descobrir() {

            alert(
                "A surpresa está apenas começando... ❤️"
            );

        }

    </script>

</body>
</html>
